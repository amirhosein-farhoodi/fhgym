[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  # Netlify's current default. Note this is ahead of the local Node 20 — fine for a Vite
  # build (no jsdom involved), and it is the version that lets jsdom unpin later.
  NODE_VERSION = "22"

# ---------------------------------------------------------------- SPA fallback
# Without this, every deep link returns Netlify's 404 page — including /auth/callback,
# which means Google sign-in works locally and dies in production with no error message.
# This is the single most common way a client-routed SPA breaks on first deploy.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ------------------------------------------------------------------- headers
[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # camera=(self) is required: Phase 2 scans QR codes in-browser.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), interest-cohort=()"

# Vite fingerprints these filenames, so they can be cached forever.
[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The exercise GIFs will be large and immutable once seeded (Phase 3).
[[headers]]
  for = "/fonts/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
